<svg xmlns="http://www.w3.org/2000/svg" viewBox="-15 -25 45 45">
  <style>
    @keyframes breathe {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-0.35px); }
    }
    @keyframes blink {
      0%, 92%, 100% { transform: scaleY(1); }
      95% { transform: scaleY(0.12); }
    }
    #body-js { animation: breathe 3.2s ease-in-out infinite; }
    #eyes-js { transform-origin: 7.5px 3.6px; animation: blink 4.4s ease-in-out infinite; }
  </style>
  <g id="shadow-js" style="transform-origin: 7.5px 15px">
    <ellipse cx="7.5" cy="16.4" rx="6.4" ry="1.4" fill="rgba(47,32,18,0.16)"/>
  </g>
  <g id="body-js">
    <ellipse cx="7.5" cy="-7.4" rx="5.6" ry="1.7" fill="none" stroke="#d4a017" stroke-width="1.1"/>
    <rect x="0.6" y="-3.2" width="13.8" height="16.2" rx="3.4" fill="#f4e6c8" stroke="#c9ae86" stroke-width="0.55"/>
    <path d="M1.4 5.4 C4.2 8.1, 10.8 8.1, 13.6 5.4 L13.2 8.8 C10.6 10.6, 4.4 10.6, 1.8 8.8 Z" fill="#e07a5f"/>
    <rect x="2.1" y="12.4" width="3.6" height="2" rx="1" fill="#d7c09a"/>
    <rect x="9.3" y="12.4" width="3.6" height="2" rx="1" fill="#d7c09a"/>
  </g>
  <g id="eyes-js">
    <circle cx="5.1" cy="3.5" r="1.15" fill="#3b2a1a"/>
    <circle cx="9.9" cy="3.5" r="1.15" fill="#3b2a1a"/>
    <circle cx="5.45" cy="3.15" r="0.28" fill="#fff8ee"/>
    <circle cx="10.25" cy="3.15" r="0.28" fill="#fff8ee"/>
  </g>
</svg>
